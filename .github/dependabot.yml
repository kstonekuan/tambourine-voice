# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/app" # Location of package manifests
    schedule:
      interval: "weekly"
    # Supply-chain hardening: wait 7 days before opening a PR for a new release.
    cooldown:
      default-days: 7

  - package-ecosystem: "cargo" # See documentation for possible values
    directory: "/app/src-tauri" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "uv" # See documentation for possible values
    directory: "/server" # Location of package manifests
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
